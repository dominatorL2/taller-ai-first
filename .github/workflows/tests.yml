name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          python-version: "3.13.5"

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Correr tests
        run: uv run pytest
